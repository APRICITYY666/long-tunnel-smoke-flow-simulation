<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>超长隧道烟气流动示意模型</title>
    <style>
      :root {
        --bg: #06131d;
        --panel: rgba(10, 22, 32, 0.75);
        --line: rgba(138, 211, 255, 0.8);
        --text: #dfefff;
        --accent: #7dd3fc;
        --warm: #ff8a5b;
        --hot: #ff4d4d;
      }

      html, body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle at center, #0a1d2d, var(--bg) 60%);
        color: var(--text);
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      #info {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 10;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        line-height: 1.6;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(8px);
      }

      #info h1 {
        margin: 0 0 8px 0;
        font-size: 20px;
        letter-spacing: 1px;
      }

      #info p {
        margin: 0;
        font-size: 12px;
        opacity: 0.9;
      }

      #legend {
        position: absolute;
        right: 18px;
        bottom: 18px;
        z-index: 10;
        background: rgba(10, 22, 32, 0.72);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        font-size: 12px;
      }

      .dot {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .label {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 12px;
        color: #e8f7ff;
        background: rgba(11, 24, 32, 0.6);
        border: 1px solid rgba(125, 211, 252, 0.45);
        padding: 4px 7px;
        border-radius: 8px;
        white-space: nowrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <h1>超长隧道烟气流动示意模型</h1>
      <p>主风流方向：左 → 右</p>
      <p>烟气源：隧道中部/近端高温源</p>
      <p>特征：纵向扩散、回流区、烟层堆积、热烟羽</p>
    </div>

    <div id="legend">
      <div class="legend-item"><span class="dot" style="background:#7dd3fc"></span> 主流风向</div>
      <div class="legend-item"><span class="dot" style="background:#7ef2cf"></span> 低温烟气</div>
      <div class="legend-item"><span class="dot" style="background:#ffb067"></span> 高温烟气</div>
      <div class="legend-item"><span class="dot" style="background:#ff4d4d"></span> 高危热区</div>
    </div>

    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
      import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x06131d);
      scene.fog = new THREE.Fog(0x06131d, 20, 70);

      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(14, 8, 22);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 0.8, 0);
      controls.minDistance = 10;
      controls.maxDistance = 40;

      const ambient = new THREE.HemisphereLight(0xaedaff, 0x0c1a22, 1.1);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0xfaffff, 1.4);
      dirLight.position.set(10, 18, 14);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.set(1024, 1024);
      scene.add(dirLight);

      const tunnelLength = 36;
      const tunnelHeight = 4.8;
      const tunnelWidth = 6.4;

      const tunnelGroup = new THREE.Group();
      scene.add(tunnelGroup);

      const floorMaterial = new THREE.MeshStandardMaterial({
        color: 0x1d2d39,
        roughness: 0.95,
        metalness: 0.15,
        emissive: 0x0a1722
      });

      const wallMaterial = new THREE.MeshStandardMaterial({
        color: 0x3b5368,
        transparent: true,
        opacity: 0.22,
        roughness: 0.9,
        metalness: 0.25
      });

      const floor = new THREE.Mesh(new THREE.BoxGeometry(tunnelLength, 0.4, tunnelWidth), floorMaterial);
      floor.position.set(0, -2.3, 0);
      floor.receiveShadow = true;
      tunnelGroup.add(floor);

      const ceiling = new THREE.Mesh(new THREE.BoxGeometry(tunnelLength, 0.28, tunnelWidth), wallMaterial);
      ceiling.position.set(0, 2.3, 0);
      tunnelGroup.add(ceiling);

      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(tunnelLength, tunnelHeight, 0.2), wallMaterial);
      leftWall.position.set(0, 0, -tunnelWidth / 2 + 0.1);
      tunnelGroup.add(leftWall);

      const rightWall = leftWall.clone();
      rightWall.position.z = tunnelWidth / 2 - 0.1;
      tunnelGroup.add(rightWall);

      const sideRailMaterial = new THREE.MeshStandardMaterial({
        color: 0x8ed9ff,
        emissive: 0x10384d,
        metalness: 0.4,
        roughness: 0.45
      });

      for (let x = -tunnelLength / 2 + 2; x <= tunnelLength / 2 - 2; x += 4) {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.12, 0.12), sideRailMaterial);
        rail.position.set(x, -1.6, -2.15);
        tunnelGroup.add(rail);

        const rail2 = rail.clone();
        rail2.position.z = 2.15;
        tunnelGroup.add(rail2);
      }

      const airCore = new THREE.Mesh(
        new THREE.BoxGeometry(tunnelLength, tunnelHeight - 0.5, tunnelWidth - 0.35),
        new THREE.MeshStandardMaterial({
          color: 0x7dd3fc,
          transparent: true,
          opacity: 0.04,
          emissive: 0x1d6789,
          side: THREE.DoubleSide
        })
      );
      airCore.position.set(0, 0, 0);
      tunnelGroup.add(airCore);

      const flowGroup = new THREE.Group();
      tunnelGroup.add(flowGroup);

      for (let i = 0; i < 10; i++) {
        const origin = new THREE.Vector3(-14 + i * 3.3, 0.5 + Math.sin(i) * 0.6, (i % 2 === 0 ? 1.6 : -1.8));
        const direction = new THREE.Vector3(1, 0.12 * Math.sin(i * 0.8), 0.08 * Math.cos(i));
        const arrow = new THREE.ArrowHelper(direction.clone().normalize(), origin, 4.5, 0x7dd3fc, 1.0, 0.55);
        flowGroup.add(arrow);
      }

      const smokeGroup = new THREE.Group();
      tunnelGroup.add(smokeGroup);

      const smokeParticles = [];
      const particleColors = [0x7ef2cf, 0xffc980, 0xff8a5b, 0xff4d4d];

      for (let i = 0; i < 180; i++) {
        const smoke = new THREE.Mesh(
          new THREE.SphereGeometry(0.18 + Math.random() * 0.24, 16, 16),
          new THREE.MeshStandardMaterial({
            color: particleColors[Math.floor(Math.random() * particleColors.length)],
            emissive: particleColors[Math.floor(Math.random() * particleColors.length)],
            emissiveIntensity: 0.25,
            transparent: true,
            opacity: 0.85,
            roughness: 0.9,
            metalness: 0.1
          })
        );

        const x = -tunnelLength / 2 + Math.random() * tunnelLength * 0.8;
        const y = -1.2 + Math.random() * 2.5;
        const z = -2.4 + Math.random() * 4.8;
        smoke.position.set(x, y, z);
        smoke.scale.setScalar(0.6 + Math.random() * 1.3);
        smokeGroup.add(smoke);

        smokeParticles.push({
          mesh: smoke,
          baseX: x,
          phase: Math.random() * Math.PI * 2,
          drift: 0.3 + Math.random() * 0.7,
          vertical: -0.12 + Math.random() * 0.25,
          lateral: -0.8 + Math.random() * 1.6,
          speed: 0.08 + Math.random() * 0.2
        });
      }

      const heatSource = new THREE.Mesh(
        new THREE.SphereGeometry(0.7, 24, 24),
        new THREE.MeshStandardMaterial({
          color: 0xffb067,
          emissive: 0xff4d4d,
          emissiveIntensity: 1.1,
          roughness: 0.3,
          metalness: 0.1
        })
      );
      heatSource.position.set(-11, 0.3, 0.4);
      tunnelGroup.add(heatSource);

      const hotZone = new THREE.Mesh(
        new THREE.ConeGeometry(2.5, 7.5, 32, 1, true),
        new THREE.MeshStandardMaterial({
          color: 0xff8a5b,
          transparent: true,
          opacity: 0.2,
          emissive: 0xff6a3d,
          side: THREE.DoubleSide
        })
      );
      hotZone.rotation.z = -Math.PI / 2;
      hotZone.position.set(-8.5, 0.5, 0.2);
      tunnelGroup.add(hotZone);

      const returnZone = new THREE.Mesh(
        new THREE.CylinderGeometry(1.7, 2.6, 7.6, 32, 1, true),
        new THREE.MeshStandardMaterial({
          color: 0x6ad5ff,
          transparent: true,
          opacity: 0.10,
          side: THREE.DoubleSide
        })
      );
      returnZone.rotation.z = Math.PI / 2;
      returnZone.position.set(8.7, -0.2, -1.9);
      tunnelGroup.add(returnZone);

      const labelConfig = [
        { text: '火源/高温烟气', position: new THREE.Vector3(-12.5, 3.5, 0.2) },
        { text: '主流风向', position: new THREE.Vector3(-2, 3.6, -2.6) },
        { text: '回流区', position: new THREE.Vector3(10.5, 1.4, -2.3) },
        { text: '烟气层堆积', position: new THREE.Vector3(8.5, 2.5, 2.2) },
        { text: '排烟口/出口', position: new THREE.Vector3(15, 2.2, 0.5) }
      ];

      const labels = [];
      for (const item of labelConfig) {
        const el = document.createElement('div');
        el.className = 'label';
        el.textContent = item.text;
        document.body.appendChild(el);
        labels.push({ text: el, position: item.position });
      }

      const clock = new THREE.Clock();

      function animate() {
        const t = clock.getElapsedTime();

        heatSource.scale.setScalar(1 + Math.sin(t * 3.5) * 0.12);
        hotZone.rotation.y = t * 0.4;

        for (let i = 0; i < smokeParticles.length; i++) {
          const p = smokeParticles[i];
          p.mesh.position.x = p.baseX + Math.sin(t * p.speed * 2.5 + p.phase) * 2.2;
          p.mesh.position.y += Math.sin(t * 1.8 + p.phase) * 0.004 + p.vertical * 0.02;
          p.mesh.position.z = ((p.mesh.position.z + 0.06) % 4.8) - 2.4 + Math.sin(t * 1.4 + p.phase) * 0.35;

          if (p.mesh.position.y > 2.2 || p.mesh.position.y < -1.8) {
            p.mesh.position.y = -1.4 + Math.random() * 2.2;
          }

          if (p.mesh.position.x > tunnelLength / 2) {
            p.mesh.position.x = -tunnelLength / 2 + Math.random() * 5;
          }
        }

        for (let i = 0; i < labels.length; i++) {
          const { text, position } = labels[i];
          const world = position.clone().applyMatrix4(tunnelGroup.matrixWorld);
          const projected = world.clone().project(camera);
          const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
          const y = (-projected.y * 0.5 + 0.5) * window.innerHeight;
          text.style.left = `${x}px`;
          text.style.top = `${y}px`;
          text.style.opacity = projected.z > 1 ? '0' : '1';
        }

        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
