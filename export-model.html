<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 模型导出工具 - 超长隧道烟气流动</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #06131d 0%, #0a1f2e 100%);
            color: #dfefff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(10, 22, 32, 0.8);
            border: 1px solid rgba(125, 211, 252, 0.4);
            border-radius: 12px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
            color: #7dd3fc;
            letter-spacing: 2px;
        }
        .subtitle {
            text-align: center;
            color: #aed9ff;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .preview {
            width: 100%;
            height: 400px;
            border: 1px solid rgba(125, 211, 252, 0.3);
            border-radius: 8px;
            margin-bottom: 20px;
            background: radial-gradient(circle at center, #0a1d2d, #06131d);
            position: relative;
            overflow: hidden;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        button {
            background: linear-gradient(135deg, #1d6789 0%, #0f4c6b 100%);
            border: 1px solid #7dd3fc;
            color: #dfefff;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #2a7fa3 0%, #1a5f88 100%);
            box-shadow: 0 0 15px rgba(125, 211, 252, 0.5);
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .info-box {
            background: rgba(125, 211, 252, 0.05);
            border-left: 3px solid #7dd3fc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.6;
        }
        .status {
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 13px;
            display: none;
        }
        .status.success {
            background: rgba(126, 242, 207, 0.15);
            color: #7ef2cf;
            border: 1px solid rgba(126, 242, 207, 0.3);
            display: block;
        }
        .status.error {
            background: rgba(255, 77, 77, 0.15);
            color: #ff8a5b;
            border: 1px solid rgba(255, 77, 77, 0.3);
            display: block;
        }
        .model-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat {
            background: rgba(13, 42, 74, 0.5);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(125, 211, 252, 0.2);
        }
        .stat-label {
            font-size: 11px;
            color: #8ad3ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 16px;
            color: #7dd3fc;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 3D 模型导出工具</h1>
        <p class="subtitle">超长隧道烟气流动 - 高质量模型导出</p>

        <div class="info-box">
            <strong>📋 说明：</strong> 点击下方按钮导出不同格式的 3D 模型。<br>
            GLTF（推荐）格式可直接在大多数 3D 编辑器中使用；<br>
            OBJ 格式兼容 Blender、Maya 等专业建模软件。
        </div>

        <div id="preview" class="preview"></div>

        <div class="model-info">
            <div class="stat">
                <div class="stat-label">隧道长度</div>
                <div class="stat-value">36.0 m</div>
            </div>
            <div class="stat">
                <div class="stat-label">隧道高度</div>
                <div class="stat-value">4.8 m</div>
            </div>
            <div class="stat">
                <div class="stat-label">隧道宽度</div>
                <div class="stat-value">6.4 m</div>
            </div>
            <div class="stat">
                <div class="stat-label">模型组件</div>
                <div class="stat-value">12+</div>
            </div>
        </div>

        <div class="controls">
            <button onclick="exportGLTF()">📥 导出 GLTF</button>
            <button onclick="exportOBJ()">📥 导出 OBJ</button>
            <button onclick="exportJSON()">📥 导出 JSON</button>
            <button onclick="downloadAll()">📥 导出全部</button>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
        import { GLTFExporter } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/exporters/GLTFExporter.js';
        import { OBJExporter } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/exporters/OBJExporter.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x06131d);

        const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
        camera.position.set(14, 8, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(860, 400);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('preview').appendChild(renderer.domElement);

        const ambient = new THREE.HemisphereLight(0xaedaff, 0x0c1a22, 1.1);
        scene.add(ambient);

        const dirLight = new THREE.DirectionalLight(0xfaffff, 1.4);
        dirLight.position.set(10, 18, 14);
        scene.add(dirLight);

        const tunnelLength = 36;
        const tunnelHeight = 4.8;
        const tunnelWidth = 6.4;

        const tunnelGroup = new THREE.Group();
        tunnelGroup.name = "Tunnel";
        scene.add(tunnelGroup);

        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0x1d2d39,
            roughness: 0.95,
            metalness: 0.15
        });
        const floor = new THREE.Mesh(new THREE.BoxGeometry(tunnelLength, 0.4, tunnelWidth), floorMaterial);
        floor.position.set(0, -2.3, 0);
        floor.name = "Floor";
        tunnelGroup.add(floor);

        const ceiling = new THREE.Mesh(new THREE.BoxGeometry(tunnelLength, 0.28, tunnelWidth), floorMaterial);
        ceiling.position.set(0, 2.3, 0);
        ceiling.name = "Ceiling";
        tunnelGroup.add(ceiling);

        const wallMaterial = new THREE.MeshStandardMaterial({
            color: 0x3b5368,
            roughness: 0.9,
            metalness: 0.25
        });
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(tunnelLength, tunnelHeight, 0.2), wallMaterial);
        leftWall.position.set(0, 0, -tunnelWidth / 2 + 0.1);
        leftWall.name = "LeftWall";
        tunnelGroup.add(leftWall);

        const rightWall = leftWall.clone();
        rightWall.position.z = tunnelWidth / 2 - 0.1;
        rightWall.name = "RightWall";
        tunnelGroup.add(rightWall);

        const sideRailMaterial = new THREE.MeshStandardMaterial({
            color: 0x8ed9ff,
            metalness: 0.4,
            roughness: 0.45
        });

        const railsGroup = new THREE.Group();
        railsGroup.name = "Rails";

        for (let x = -tunnelLength / 2 + 2; x <= tunnelLength / 2 - 2; x += 4) {
            const rail = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.12, 0.12), sideRailMaterial);
            rail.position.set(x, -1.6, -2.15);
            railsGroup.add(rail);

            const rail2 = rail.clone();
            rail2.position.z = 2.15;
            railsGroup.add(rail2);
        }
        tunnelGroup.add(railsGroup);

        const heatSource = new THREE.Mesh(
            new THREE.SphereGeometry(0.7, 24, 24),
            new THREE.MeshStandardMaterial({
                color: 0xffb067,
                emissive: 0xff4d4d,
                emissiveIntensity: 1.1,
                roughness: 0.3
            })
        );
        heatSource.position.set(-11, 0.3, 0.4);
        heatSource.name = "HeatSource";
        tunnelGroup.add(heatSource);

        const hotZone = new THREE.Mesh(
            new THREE.ConeGeometry(2.5, 7.5, 32),
            new THREE.MeshStandardMaterial({
                color: 0xff8a5b,
                emissive: 0xff6a3d,
                roughness: 0.6,
                transparent: true,
                opacity: 0.8
            })
        );
        hotZone.rotation.z = -Math.PI / 2;
        hotZone.position.set(-8.5, 0.5, 0.2);
        hotZone.name = "HotPlume";
        tunnelGroup.add(hotZone);

        const returnZone = new THREE.Mesh(
            new THREE.CylinderGeometry(1.7, 2.6, 7.6, 32),
            new THREE.MeshStandardMaterial({
                color: 0x6ad5ff,
                emissive: 0x1d6789,
                roughness: 0.7,
                metalness: 0.1,
                transparent: true,
                opacity: 0.5
            })
        );
        returnZone.rotation.z = Math.PI / 2;
        returnZone.position.set(8.7, -0.2, -1.9);
        returnZone.name = "BackflowZone";
        tunnelGroup.add(returnZone);

        const mainFlowGroup = new THREE.Group();
        mainFlowGroup.name = "MainFlowArrows";
        for (let i = 0; i < 5; i++) {
            const arrowHelper = new THREE.ArrowHelper(
                new THREE.Vector3(1, 0, 0),
                new THREE.Vector3(-12 + i * 6, 0.5, 0),
                4,
                0x7dd3fc
            );
            mainFlowGroup.add(arrowHelper);
        }
        tunnelGroup.add(mainFlowGroup);

        const smokeGeometry = new THREE.BufferGeometry();
        const smokePositions = [];
        for (let i = 0; i < 120; i++) {
            smokePositions.push(
                -14 + Math.random() * 28,
                -1 + Math.random() * 3,
                -2.4 + Math.random() * 4.8
            );
        }
        smokeGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(smokePositions), 3));
        const smokeMaterial = new THREE.PointsMaterial({
            color: 0xff8a5b,
            size: 0.3,
            sizeAttenuation: true,
            transparent: true,
            opacity: 0.9
        });
        const smokeParticles = new THREE.Points(smokeGeometry, smokeMaterial);
        smokeParticles.name = "SmokeParticles";
        tunnelGroup.add(smokeParticles);

        function showStatus(message, isSuccess = true) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${isSuccess ? 'success' : 'error'}`;
            statusEl.style.display = 'block';
            clearTimeout(showStatus.timer);
            showStatus.timer = setTimeout(() => {
                statusEl.style.display = 'none';
            }, 3000);
        }

        function exportGLTF() {
            const exporter = new GLTFExporter();
            exporter.parse(scene, function(gltf) {
                const blob = new Blob([JSON.stringify(gltf)], { type: 'application/json' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'tunnel-smoke-flow-model.glb';
                link.click();
                showStatus('✓ GLTF 模型已导出！', true);
            }, function(error) {
                console.error(error);
                showStatus('✗ 导出失败，请重试', false);
            }, { binary: true });
        }

        function exportOBJ() {
            const exporter = new OBJExporter();
            const result = exporter.parse(scene);
            const blob = new Blob([result], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'tunnel-smoke-flow-model.obj';
            link.click();
            showStatus('✓ OBJ 模型已导出！', true);
        }

        function exportJSON() {
            const data = {
                name: 'Long Tunnel Smoke Flow Model',
                description: '3D conceptual model for smoke flow in long tunnels',
                metadata: {
                    tunnelLength: 36,
                    tunnelHeight: 4.8,
                    tunnelWidth: 6.4,
                    heatSourcePosition: [-11, 0.3, 0.4],
                    backflowZonePosition: [8.7, -0.2, -1.9]
                },
                components: [
                    { name: 'Floor', type: 'BoxGeometry', dimensions: [36, 0.4, 6.4] },
                    { name: 'Ceiling', type: 'BoxGeometry', dimensions: [36, 0.28, 6.4] },
                    { name: 'LeftWall', type: 'BoxGeometry', dimensions: [36, 4.8, 0.2] },
                    { name: 'RightWall', type: 'BoxGeometry', dimensions: [36, 4.8, 0.2] },
                    { name: 'HeatSource', type: 'SphereGeometry', radius: 0.7 },
                    { name: 'HotPlume', type: 'ConeGeometry', height: 7.5, radius: 2.5 },
                    { name: 'BackflowZone', type: 'CylinderGeometry', height: 7.6, radiusBottom: 2.6, radiusTop: 1.7 }
                ]
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'tunnel-smoke-flow-metadata.json';
            link.click();
            showStatus('✓ 元数据已导出！', true);
        }

        function downloadAll() {
            exportGLTF();
            setTimeout(exportOBJ, 200);
            setTimeout(exportJSON, 400);
            setTimeout(() => showStatus('✓ 全部文件已导出完成！', true), 600);
        }

        function animate() {
            heatSource.scale.setScalar(1 + Math.sin(Date.now() / 400) * 0.12);
            smokeParticles.rotation.y += 0.003;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            const width = document.getElementById('preview').clientWidth;
            const height = 400;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        window.exportGLTF = exportGLTF;
        window.exportOBJ = exportOBJ;
        window.exportJSON = exportJSON;
        window.downloadAll = downloadAll;
    </script>
</body>
</html>
